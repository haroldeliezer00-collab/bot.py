services:
  - type: web
    name: bot-agencia-haroldjose
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn bot:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TZ
        value: "America/Caracas"
